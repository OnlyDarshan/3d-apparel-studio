<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>3D Apparel Mockup Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0f172a; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .ui-panel { z-index: 10; }
  </style>
</head>
<body class="text-slate-100">

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Responsive Mobile & Desktop Control Panel -->
  <div class="ui-panel absolute bottom-0 left-0 right-0 md:top-4 md:left-4 md:right-auto md:bottom-auto w-full md:w-80 bg-slate-900/95 backdrop-blur-md p-5 rounded-t-2xl md:rounded-xl border-t md:border border-slate-800 shadow-2xl space-y-3 max-h-[45vh] md:max-h-none overflow-y-auto">
    <div class="flex justify-between items-center">
      <h2 class="text-base md:text-lg font-bold text-white">Apparel Studio</h2>
      <span class="text-xs text-slate-400 md:hidden">Swipe down to view shirt</span>
    </div>
    
    <!-- Customization Controls -->
    <div class="grid grid-cols-2 md:grid-cols-1 gap-3">
      <div>
        <label class="text-[10px] font-semibold text-slate-400 uppercase">Fabric Color</label>
        <input type="color" id="color-picker" value="#334155" class="w-full h-8 rounded cursor-pointer bg-transparent border-0" />
      </div>

      <div>
        <label class="text-[10px] font-semibold text-slate-400 uppercase">Fabric Type</label>
        <select id="fabric-select" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-white focus:outline-none">
          <option value="cotton">Cotton (Fine Weave)</option>
          <option value="fleece">Fleece (Soft Pile)</option>
        </select>
      </div>
    </div>

    <div>
      <label class="text-[10px] font-semibold text-slate-400 uppercase">Custom Graphic</label>
      <input type="file" id="graphic-upload" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-blue-600 file:text-white cursor-pointer" />
    </div>

    <div class="space-y-1.5 border-t border-slate-800 pt-2">
      <label class="text-[10px] font-semibold text-slate-400 uppercase">Graphic Scale</label>
      <input type="range" id="graphic-scale" min="0.2" max="2" step="0.05" value="1" class="w-full accent-blue-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
      
      <label class="text-[10px] font-semibold text-slate-400 uppercase">Graphic Y-Offset</label>
      <input type="range" id="graphic-offset-y" min="-0.5" max="0.5" step="0.02" value="0" class="w-full accent-blue-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
    </div>

    <button id="export-btn" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-xs transition-colors shadow-lg mt-2">
      Export Render (PNG)
    </button>
  </div>

  <!-- Three.js Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
